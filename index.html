<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Patients">
<meta name="theme-color" content="#1971c2">
<title>Mes Patients</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;background:#f1f3f5;color:#212529;min-height:100vh;overscroll-behavior:none}
input,textarea,button{font-family:inherit}
input,textarea{-webkit-appearance:none}

.header{background:linear-gradient(135deg,#228be6,#1971c2);padding:env(safe-area-inset-top,16px) 16px 20px;padding-top:calc(env(safe-area-inset-top,16px) + 12px);position:sticky;top:0;z-index:100}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.header h1{font-size:22px;font-weight:800;color:#fff}
.count{font-size:13px;color:rgba(255,255,255,.7)}
.btn-add{width:42px;height:42px;border-radius:12px;border:none;background:#fff;color:#228be6;font-size:26px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-add:active{transform:scale(.92)}
.search-box{position:relative}
.search-box input{width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:14px;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,.5)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%)}

.patient-list{padding:12px 16px 120px}
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:#495057;margin-bottom:6px}
.empty-sub{font-size:14px;color:#868e96}

.card{background:#fff;border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04)}
.card-header{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.card-info{flex:1;min-width:0}
.card-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-detail{font-size:12px;color:#868e96;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex-shrink:0;transition:transform .2s;color:#adb5bd}
.chev.open{transform:rotate(180deg)}
.card-body{padding:0 16px 16px;display:none}
.card-body.open{display:block}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fld label{font-size:11px;color:#868e96;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.fld input{width:100%;border:1px solid #e9ecef;border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
.fld input:focus{border-color:#228be6}
.mb12{margin-bottom:12px}
.sl{font-size:11px;color:#868e96;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
.fi{width:100%;border:1px solid #e9ecef;border-radius:8px;padding:8px 10px;font-size:14px;outline:none;font-family:inherit;resize:vertical}
.fi:focus{border-color:#228be6}

.atcd-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.atcd-tag{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid #dee2e6;background:#fff;color:#495057;transition:all .15s;user-select:none}
.atcd-tag.on{background:#d0ebff;border-color:#74c0fc;color:#1971c2;font-weight:600}
.atcd-custom-row{display:flex;gap:6px;margin-top:4px}
.atcd-custom-input{flex:1;border:1px solid #e9ecef;border-radius:20px;padding:6px 12px;font-size:12px;outline:none}
.atcd-custom-input:focus{border-color:#228be6}
.atcd-custom-btn{padding:6px 14px;border-radius:20px;border:none;background:#228be6;color:#fff;font-size:12px;font-weight:600;cursor:pointer}

.bio-tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.bio-tabs::-webkit-scrollbar{display:none}
.bio-tab{padding:6px 12px;border-radius:8px;border:1.5px solid #e9ecef;background:#fff;font-size:12px;font-weight:600;color:#868e96;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.bio-tab.active{background:#228be6;color:#fff;border-color:#228be6}
.bio-tab-add{background:#e7f5ff;color:#228be6;border-color:#d0ebff}
.bio-tab-del{margin-left:4px;font-size:10px;opacity:.7}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bi{display:flex;align-items:center;gap:4px;background:#f8f9fa;border-radius:8px;padding:6px 8px}
.bi.abnormal{background:#fff5f5}
.bi.abnormal .bl{color:#e03131}
.bl{font-size:12px;font-weight:600;color:#495057;min-width:36px}
.bi input{flex:1;border:none;background:#fff;border-radius:6px;padding:4px 6px;font-size:13px;min-width:0;outline:none}
.bi.abnormal input{color:#e03131;font-weight:600}
.bu{font-size:10px;color:#868e96;white-space:nowrap}
.trend{font-size:12px;margin-left:2px;font-weight:700;min-width:14px}
.trend-up{color:#e03131}
.trend-down{color:#2f9e44}
.trend-stable{color:#868e96}

.btn-row{display:flex;gap:8px;margin-bottom:8px}
.btn-share{flex:1;padding:10px;border-radius:10px;border:1px solid #d0ebff;background:#e7f5ff;color:#1971c2;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.btn-share:active{background:#d0ebff}
.bd{width:100%;padding:10px;border-radius:10px;border:1px solid #ffc9c9;background:#fff5f5;color:#e03131;font-size:14px;font-weight:600;cursor:pointer}
.cr{display:flex;gap:8px}
.bc{flex:1;padding:10px;border-radius:10px;border:1px solid #e9ecef;background:#fff;font-size:14px;cursor:pointer}
.bcd{flex:1;padding:10px;border-radius:10px;border:none;background:#e03131;color:#fff;font-size:14px;font-weight:600;cursor:pointer}

.allergy-box{border:1px solid #ffc9c9;border-radius:8px;padding:8px 10px;font-size:14px;outline:none;width:100%;font-family:inherit;background:#fff5f5;color:#e03131}
.allergy-box:focus{border-color:#e03131}
.allergy-box::placeholder{color:#ffa8a8}

/* Todo */
.todo-list{margin-bottom:6px}
.todo-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f3f5}
.todo-item:last-child{border-bottom:none}
.todo-cb{width:20px;height:20px;border-radius:6px;border:2px solid #dee2e6;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.todo-cb.done{background:#228be6;border-color:#228be6}
.todo-cb.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.todo-text{flex:1;font-size:14px;color:#212529}
.todo-text.done{text-decoration:line-through;color:#adb5bd}
.todo-del{color:#dee2e6;font-size:16px;cursor:pointer;padding:0 4px}
.todo-add-row{display:flex;gap:6px}
.todo-add-input{flex:1;border:1px solid #e9ecef;border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.todo-add-input:focus{border-color:#228be6}
.todo-add-btn{padding:8px 14px;border-radius:8px;border:none;background:#228be6;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.todo-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.todo-preset{padding:5px 10px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid #d0ebff;background:#e7f5ff;color:#1971c2;user-select:none;transition:all .15s}
.todo-preset:active{background:#d0ebff}

/* === SUIVI CLINIQUE === */
.suivi-grid{display:flex;flex-direction:column;gap:6px}
.suivi-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  border:1.5px solid #e9ecef;background:#f8f9fa;
  cursor:pointer;user-select:none;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.suivi-item.ok{
  background:#ebfbee;border-color:#8ce99a;
}
.suivi-item:active{transform:scale(.97)}
.suivi-check{
  width:22px;height:22px;border-radius:50%;border:2px solid #ced4da;background:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
  font-size:13px;
}
.suivi-item.ok .suivi-check{
  background:#2f9e44;border-color:#2f9e44;color:#fff;
}
.suivi-label{font-size:13px;font-weight:500;color:#495057;flex:1;transition:all .2s}
.suivi-item.ok .suivi-label{color:#2f9e44;font-weight:600}
.suivi-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;transition:all .2s}
.suivi-item:not(.ok) .suivi-status{background:#f1f3f5;color:#adb5bd}
.suivi-item.ok .suivi-status{background:#d3f9d8;color:#2f9e44}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
#importInput{display:none}

.todo-badge{background:#e03131;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>
<div class="header">
<div class="header-row">
<div><h1>Mes Patients</h1><span class="count" id="cnt">0 patient</span></div>
<button class="btn-add" onclick="addP()">+</button>
</div>
<div class="search-box">
<svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
<input type="text" id="si" placeholder="Rechercher un patient..." oninput="render()">
</div></div>



<div class="patient-list" id="pl"></div>
<div class="toast" id="toast"></div>

<script>
// === DB ===
const DN='PatientsDB',DV=5,ST='patients';
function odb(){return new Promise((s,j)=>{const r=indexedDB.open(DN,DV);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST,{keyPath:'id'})};r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)})}
async function getAll(){const d=await odb();return new Promise((s,j)=>{const t=d.transaction(ST,'readonly'),r=t.objectStore(ST).getAll();r.onsuccess=()=>s(r.result||[]);r.onerror=()=>j(r.error)})}
async function sav(p){const d=await odb();return new Promise((s,j)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(p);t.oncomplete=()=>s();t.onerror=()=>j(t.error)})}
async function del(id){const d=await odb();return new Promise((s,j)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(id);t.oncomplete=()=>s();t.onerror=()=>j(t.error)})}

// === STATE ===
let P=[],exId=null,cfmId=null,activeBilan={},saveTimers={};

const BF=[
  {k:'hb',l:'Hb',u:'g/dL',lo:7,hi:18},
  {k:'plq',l:'Plq',u:'G/L',lo:150,hi:400},
  {k:'gb',l:'GB',u:'G/L',lo:4,hi:10},
  {k:'creat',l:'Creat',u:'µmol/L',lo:0,hi:120},
  {k:'dfg',l:'DFG',u:'mL/min',lo:60,hi:999},
  {k:'k',l:'K+',u:'mmol/L',lo:3.5,hi:5.5},
  {k:'crp',l:'CRP',u:'mg/L',lo:0,hi:5},
  {k:'tropo',l:'Tropo',u:'ng/L',lo:0,hi:14}
];

const ATCD_LIST=[
  'HTA','Diabete T2','Diabete T1','FA','BPCO','Asthme',
  'IRC','Insuf. cardiaque','IDM','AVC','Demence','Epilepsie',
  'TVP/EP','Pacemaker','Valvulopathie'
];

const TODO_PRESETS=[
  'Bilan a voir','Analgesie','Tropo','Avis infectio',
  'Scanner','Hemocultures','ECBU',
  'Antibiotiques','Anticoagulation',
];

// === SUIVI CLINIQUE ===
const SUIVI_ITEMS=[
  {k:'tvp',    label:'Absence de TVP / EP',     ok:'✓ Absence de TVP / EP'},
  {k:'analg',  label:'Analgésie contrôlée',      ok:'✓ Analgésie contrôlée'},
  {k:'miction',label:'Reprise de la miction',    ok:'✓ Reprise de la miction'},
  {k:'selles', label:'Reprise de selles',        ok:'✓ Reprise de selles'},
];

function defaultSuivi(){const s={};SUIVI_ITEMS.forEach(i=>s[i.k]=false);return s;}

function todayFull(){const d=new Date();return (d.getDate()+'').padStart(2,'0')+'/'+(d.getMonth()+1+'').padStart(2,'0')+'/'+d.getFullYear()}

// === INIT ===
async function init(){P=await getAll();
  P.forEach(p=>{
    if(p.bio&&!Array.isArray(p.bilans)){p.bilans=[{date:todayFull(),bio:p.bio}];delete p.bio}
    if(!p.bilans)p.bilans=[];
    if(!p.atcdList)p.atcdList=[];
    if(!p.atcdCustom)p.atcdCustom=[];
    if(!p.allergies)p.allergies='';
    if(!p.todos)p.todos=[];
    if(!p.suivi)p.suivi=defaultSuivi();
  });
  render();
}
init();

// === HELPERS ===
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function getABI(p){if(!p.bilans||!p.bilans.length)return -1;const i=activeBilan[p.id];return(i!==undefined&&i<p.bilans.length)?i:0}
function debouncedSav(p){if(saveTimers[p.id])clearTimeout(saveTimers[p.id]);saveTimers[p.id]=setTimeout(()=>sav(p),300)}

function isAbnormal(field,val){
  const v=parseFloat(val);if(isNaN(v))return false;
  return v<field.lo||v>field.hi;
}

function getTrend(p,bilanIdx,key){
  if(bilanIdx<0||bilanIdx>=p.bilans.length-1)return '';
  const cur=parseFloat((p.bilans[bilanIdx].bio||{})[key]);
  const prev=parseFloat((p.bilans[bilanIdx+1].bio||{})[key]);
  if(isNaN(cur)||isNaN(prev))return '';
  const diff=cur-prev;
  const pct=Math.abs(diff/prev)*100;
  if(pct<3)return '<span class="trend trend-stable">→</span>';
  if(diff>0)return '<span class="trend trend-up">↑</span>';
  return '<span class="trend trend-down">↓</span>';
}

// === RENDER ===
function render(){
  const q=document.getElementById('si').value.toLowerCase().trim();
  let f=P;if(q)f=P.filter(p=>[p.nom,p.prenom,p.chambre,p.motif,p.chirurgien].some(v=>(v||'').toLowerCase().includes(q)));
  document.getElementById('cnt').textContent=P.length+' patient'+(P.length!==1?'s':'');
  const el=document.getElementById('pl');
  if(!f.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🏥</div><div class="empty-title">'+(q?'Aucun resultat':'Aucun patient')+'</div><div class="empty-sub">'+(q?'Essaie un autre terme':'Appuie sur +')+'</div></div>';return}
  el.innerHTML=f.map(rc).join('');
}

function rc(p){
  const op=exId===p.id,cf=cfmId===p.id;
  const dt=[p.chambre&&('Ch.'+p.chambre),p.chirurgien&&('Dr '+p.chirurgien),p.motif].filter(Boolean).join(' · ')||'Aucun detail';
  const bi=getABI(p),cb=bi>=0?p.bilans[bi]:null;

  // Todo count
  const todoCount=(p.todos||[]).filter(t=>!t.done).length;
  const todoBadge=todoCount?'<span class="todo-badge">'+todoCount+'</span>':'';

  // ATCD
  let ah='<div class="atcd-tags">';
  ATCD_LIST.forEach(a=>{ah+='<span class="atcd-tag'+(p.atcdList.includes(a)?' on':'')+'" onclick="toggleAtcd(\''+p.id+'\',\''+esc(a)+'\')">'+esc(a)+'</span>'});
  if(p.atcdCustom)p.atcdCustom.forEach(a=>{ah+='<span class="atcd-tag on" onclick="removeCA(\''+p.id+'\',\''+esc(a)+'\')">'+esc(a)+' ✕</span>'});
  ah+='</div><div class="atcd-custom-row"><input class="atcd-custom-input" id="ai-'+p.id+'" placeholder="Autre ATCD..." onkeydown="if(event.key===\'Enter\')addCA(\''+p.id+'\')"><button class="atcd-custom-btn" onclick="addCA(\''+p.id+'\')">+</button></div>';

  // Bilan tabs
  let bTabs='<div class="bio-tabs"><div class="bio-tab bio-tab-add" onclick="addBilan(\''+p.id+'\')">+ Bilan</div>';
  if(p.bilans)p.bilans.forEach((b,i)=>{bTabs+='<div class="bio-tab'+(i===bi?' active':'')+'" onclick="switchB(\''+p.id+'\','+i+')" ondblclick="event.stopPropagation();editBD(\''+p.id+'\','+i+')">'+esc(b.date)+(p.bilans.length>1?'<span class="bio-tab-del" onclick="event.stopPropagation();delB(\''+p.id+'\','+i+')"> ✕</span>':'')+'</div>'});
  bTabs+='</div>';

  // Bio fields with abnormal + trend
  let bh='';
  if(cb){
    bh='<div class="bg">'+BF.map(f=>{
      const val=(cb.bio||{})[f.k]||'';
      const abn=isAbnormal(f,val);
      const trend=getTrend(p,bi,f.k);
      return '<div class="bi'+(abn?' abnormal':'')+'"><span class="bl">'+f.l+'</span><input type="text" inputmode="decimal" value="'+esc(val)+'" placeholder="—" oninput="uBio(\''+p.id+'\','+bi+',\''+f.k+'\',this.value)">'+(f.u?'<span class="bu">'+f.u+'</span>':'')+ trend+'</div>';
    }).join('')+'</div>';
  }else{
    bh='<div style="text-align:center;color:#868e96;font-size:13px;padding:12px">Appuie sur "+ Bilan"</div>';
  }

  // Todos
  let todoHTML='<div class="todo-list">';
  (p.todos||[]).forEach((t,i)=>{
    todoHTML+='<div class="todo-item"><div class="todo-cb'+(t.done?' done':'')+'" onclick="toggleTodo(\''+p.id+'\','+i+')"></div><span class="todo-text'+(t.done?' done':'')+'">'+esc(t.text)+'</span><span class="todo-del" onclick="delTodo(\''+p.id+'\','+i+')">✕</span></div>';
  });
  todoHTML+='</div>';
  todoHTML+='<div class="todo-presets">';
  const existingTexts=(p.todos||[]).map(t=>t.text);
  TODO_PRESETS.forEach(t=>{
    if(!existingTexts.includes(t)){
      todoHTML+='<span class="todo-preset" onclick="addPresetTodo(\''+p.id+'\',\''+esc(t)+'\')">+ '+esc(t)+'</span>';
    }
  });
  todoHTML+='</div>';
  todoHTML+='<div class="todo-add-row"><input class="todo-add-input" id="ti-'+p.id+'" placeholder="Ajouter une tache..." onkeydown="if(event.key===\'Enter\')addTodo(\''+p.id+'\')"><button class="todo-add-btn" onclick="addTodo(\''+p.id+'\')">+</button></div>';

  // Suivi clinique
  const sv=p.suivi||defaultSuivi();
  const doneCount=SUIVI_ITEMS.filter(i=>sv[i.k]).length;
  let suiviHTML='<div class="suivi-grid">';
  SUIVI_ITEMS.forEach(item=>{
    const checked=!!sv[item.k];
    suiviHTML+=`<div class="suivi-item${checked?' ok':''}" onclick="toggleSuivi('${p.id}','${item.k}')">
      <div class="suivi-check">${checked?'✓':''}</div>
      <span class="suivi-label">${checked?item.ok:item.label}</span>
      <span class="suivi-status">${checked?'OK':'—'}</span>
    </div>`;
  });
  suiviHTML+='</div>';

  return '<div class="card"><div class="card-header" onclick="tog(\''+p.id+'\')"><div class="card-info"><div class="card-name">'+esc(p.nom||'—')+' '+esc(p.prenom||'')+todoBadge+'</div><div class="card-detail">'+esc(dt)+'</div></div><svg class="chev '+(op?'open':'')+'" width="20" height="20" viewBox="0 0 20 20"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div><div class="card-body '+(op?'open':'')+'">'

  +'<div class="grid2">'+fh(p,'nom','Nom')+fh(p,'prenom','Prenom')+fh(p,'age','Âge','ans')+fh(p,'chambre','Chambre')+fh(p,'chirurgien','Chirurgien')+fh(p,'motif','Motif','Pneumopathie...')+'</div>'

  +'<div class="mb12"><label class="sl">Allergies</label><input class="allergy-box" value="'+esc(p.allergies||'')+'" placeholder="Aucune allergie connue" oninput="uf(\''+p.id+'\',\'allergies\',this.value)"></div>'

  +'<div class="mb12"><label class="sl">Antecedents</label>'+ah+'</div>'

  +'<div class="mb12"><label class="sl">Biologie</label>'+bTabs+bh+'</div>'

  +'<div class="mb12"><label class="sl">A faire</label>'+todoHTML+'</div>'

  +'<div class="mb12"><label class="sl">Suivi clinique · '+doneCount+'/'+SUIVI_ITEMS.length+'</label>'+suiviHTML+'</div>'

  +'<div class="mb12"><label class="sl">Notes</label><textarea class="fi" rows="3" placeholder="Remarques..." oninput="uf(\''+p.id+'\',\'notes\',this.value)">'+esc(p.notes||'')+'</textarea></div>'

  +'<div class="btn-row"><button class="btn-share" onclick="shareMsg(\''+p.id+'\')">📤 Partager fiche</button></div>'

  +(!cf?'<button class="bd" onclick="askDel(\''+p.id+'\')">Sortie / Supprimer</button>':'<div class="cr"><button class="bc" onclick="cancelDel()">Annuler</button><button class="bcd" onclick="cfmDel(\''+p.id+'\')">Confirmer</button></div>')
  +'</div></div>';
}

function fh(p,k,l,ph){return '<div class="fld"><label>'+l+'</label><input value="'+esc(p[k]||'')+'"'+(ph?' placeholder="'+ph+'"':'')+' oninput="uf(\''+p.id+'\',\''+k+'\',this.value)" onblur="render()"></div>'}

// === ACTIONS ===
function tog(id){exId=exId===id?null:id;cfmId=null;render()}

async function addP(){
  const p={id:Date.now()+''+Math.random().toString(36).slice(2,6),nom:'',prenom:'',age:'',chambre:'',chirurgien:'',motif:'',atcdList:[],atcdCustom:[],allergies:'',bilans:[],todos:[],suivi:defaultSuivi(),notes:'',createdAt:new Date().toISOString()};
  P.unshift(p);await sav(p);exId=p.id;render();tw('Patient ajoute');
}

function uf(id,f,v){
  const p=P.find(x=>x.id===id);if(!p)return;p[f]=v;debouncedSav(p);
}

// ATCD
async function toggleAtcd(id,a){
  const p=P.find(x=>x.id===id);if(!p)return;
  const i=p.atcdList.indexOf(a);
  if(i>=0)p.atcdList.splice(i,1);else p.atcdList.push(a);
  await sav(p);render();
}
async function addCA(id){
  const inp=document.getElementById('ai-'+id);const v=inp.value.trim();if(!v)return;
  const p=P.find(x=>x.id===id);if(!p)return;
  if(!p.atcdCustom.includes(v)){p.atcdCustom.push(v);await sav(p);render()}
  inp.value='';
}
async function removeCA(id,a){
  const p=P.find(x=>x.id===id);if(!p)return;
  p.atcdCustom=p.atcdCustom.filter(x=>x!==a);await sav(p);render();
}

// BILANS
async function addBilan(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const d=prompt('Date du bilan (JJ/MM/AAAA):',todayFull());if(!d)return;
  p.bilans.unshift({date:d,bio:{}});activeBilan[id]=0;
  await sav(p);render();
}
function switchB(id,i){activeBilan[id]=i;render()}
async function delB(id,i){
  const p=P.find(x=>x.id===id);if(!p)return;
  p.bilans.splice(i,1);
  if((activeBilan[id]||0)>=p.bilans.length)activeBilan[id]=Math.max(0,p.bilans.length-1);
  await sav(p);render();
}
async function editBD(id,i){
  const p=P.find(x=>x.id===id);if(!p||!p.bilans[i])return;
  const d=prompt('Nouvelle date:',p.bilans[i].date);if(!d)return;
  p.bilans[i].date=d;await sav(p);render();
}
function uBio(id,bi,k,v){
  const p=P.find(x=>x.id===id);if(!p||!p.bilans[bi])return;
  if(!p.bilans[bi].bio)p.bilans[bi].bio={};
  p.bilans[bi].bio[k]=v;debouncedSav(p);
  clearTimeout(saveTimers['render_'+id]);
  saveTimers['render_'+id]=setTimeout(()=>render(),500);
}

// TODOS
async function addTodo(id){
  const inp=document.getElementById('ti-'+id);const v=inp.value.trim();if(!v)return;
  const p=P.find(x=>x.id===id);if(!p)return;
  if(!p.todos)p.todos=[];
  p.todos.push({text:v,done:false});
  await sav(p);render();
}
async function toggleTodo(id,i){
  const p=P.find(x=>x.id===id);if(!p||!p.todos[i])return;
  p.todos[i].done=!p.todos[i].done;
  await sav(p);render();
}
async function delTodo(id,i){
  const p=P.find(x=>x.id===id);if(!p)return;
  p.todos.splice(i,1);
  await sav(p);render();
}
async function addPresetTodo(id,text){
  const p=P.find(x=>x.id===id);if(!p)return;
  if(!p.todos)p.todos=[];
  if(!p.todos.find(t=>t.text===text)){
    p.todos.push({text:text,done:false});
    await sav(p);render();
  }
}

// SUIVI CLINIQUE
async function toggleSuivi(id,key){
  const p=P.find(x=>x.id===id);if(!p)return;
  if(!p.suivi)p.suivi=defaultSuivi();
  p.suivi[key]=!p.suivi[key];
  await sav(p);render();
}

// DELETE
function askDel(id){cfmId=id;render()}
function cancelDel(){cfmId=null;render()}
async function cfmDel(id){P=P.filter(p=>p.id!==id);await del(id);exId=null;cfmId=null;render();tw('Patient supprime')}

// === SHARE / EXPORT MESSAGE ===
function buildMsg(p){
  let l=[];
  const name=[p.nom,p.prenom].filter(Boolean).join(' ');
  if(name)l.push('🏥 '+name);
  if(p.age)l.push('Âge: '+p.age+' ans');
  if(p.chambre)l.push('Chambre: '+p.chambre);
  if(p.chirurgien)l.push('Chirurgien: '+p.chirurgien);
  if(p.motif)l.push('Motif: '+p.motif);
  if(p.allergies)l.push('\n⚠️ Allergies: '+p.allergies);
  const allA=[...(p.atcdList||[]),...(p.atcdCustom||[])];
  if(allA.length)l.push('\nATCD: '+allA.join(', '));
  if(p.bilans&&p.bilans.length){
    p.bilans.forEach(b=>{
      const vals=BF.map(f=>{
        if(!b.bio||!b.bio[f.k])return null;
        let s=f.l+': '+b.bio[f.k]+(f.u?' '+f.u:'');
        if(isAbnormal(f,b.bio[f.k]))s+=' ⚠️';
        return s;
      }).filter(Boolean);
      if(vals.length)l.push('\nBio '+b.date+':\n'+vals.join(' | '));
    });
  }
  const pending=(p.todos||[]).filter(t=>!t.done);
  if(pending.length)l.push('\nA faire:\n'+pending.map(t=>'☐ '+t.text).join('\n'));
  // Suivi clinique dans le message partagé
  if(p.suivi){
    const suiviLines=SUIVI_ITEMS.map(i=>p.suivi[i.k]?'✓ '+i.label:'☐ '+i.label);
    l.push('\nSuivi clinique:\n'+suiviLines.join('\n'));
  }
  if(p.notes)l.push('\nNotes: '+p.notes);
  return l.join('\n');
}

async function shareMsg(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  const msg=buildMsg(p);
  const name=[p.nom,p.prenom].filter(Boolean).join(' ')||'Patient';
  if(navigator.share){
    try{
      await navigator.share({title:name,text:msg});
      tw('Fiche partagee !');
    }catch(e){
      if(e.name!=='AbortError')copyFallback(msg);
    }
  }else{
    copyFallback(msg);
  }
}

function copyFallback(msg){
  navigator.clipboard.writeText(msg).then(()=>tw('Fiche copiee !')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);tw('Fiche copiee !');
  });
}

// === BACKUP ===
async function exportAll(){const a=await getAll(),b=new Blob([JSON.stringify(a,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='patients-'+new Date().toISOString().slice(0,10)+'.json';l.click();tw('Sauvegarde telechargee')}
async function importD(e){const file=e.target.files?.[0];if(!file)return;try{const t=await file.text(),imp=JSON.parse(t);let c=0;for(const p of imp){if(p.id&&!P.find(x=>x.id===p.id)){P.push(p);await sav(p);c++}}render();tw(c+' importe(s)')}catch{tw("Erreur")}e.target.value=''}
async function purge(){const rm=P.filter(p=>!p.nom&&!p.prenom);if(!rm.length){tw('Rien a purger');return}for(const p of rm)await del(p.id);P=P.filter(p=>p.nom||p.prenom);render();tw(rm.length+' vide(s) supprimee(s)')}

function tw(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
